// ==================== Flashcards (works for BOTH phrases & 熟词生义!) ====================
const fc = { mode: "phrases", deck: [], idx: 0, flipped: false };
const fcModal = document.getElementById("fcModal");
const fcStats = {
  active: false,
  mode: "phrases",
  deckSize: 0,
  startTime: 0,
  viewedSet: new Set(),
  flipsCount: 0,
  masteredCount: 0,
  starredCount: 0,
  inputs: { touch: 0, click: 0, keyboard: 0 },
};

function getFcItemKey(it) {
  if (!it) return "";
  return fc.mode === "poly" ? it.w : it.p;
}

function recordFcView(inputMethod) {
  if (!fcStats.active) return;
  const k = getFcItemKey(fc.deck[fc.idx]);
  if (k) fcStats.viewedSet.add(k);
  if (inputMethod && fcStats.inputs[inputMethod] !== undefined) {
    fcStats.inputs[inputMethod]++;
  }
}

function flushFlashcardSession(completed = false, useBeacon = false) {
  if (!fcStats.active) return;
  fcStats.active = false;
  const durationSec = Math.max(1, Math.round((Date.now() - fcStats.startTime) / 1000));
  let inputMethod = "click";
  let best = 0;
  for (const k of ["touch", "keyboard", "click"]) {
    if (fcStats.inputs[k] > best) {
      best = fcStats.inputs[k];
      inputMethod = k;
    }
  }
  trackEvent("flashcard_session_end", {
    mode: fcStats.mode,
    deck_size: fcStats.deckSize,
    cards_viewed: fcStats.viewedSet.size,
    flips_count: fcStats.flipsCount,
    mastered_count: fcStats.masteredCount,
    starred_count: fcStats.starredCount,
    duration_sec: durationSec,
    completed: Boolean(completed),
    input_method: inputMethod,
  }, useBeacon);
}

function openFlashcards() {
  fc.mode = state.mod === "poly" ? "poly" : "phrases";
  if (fc.mode === "poly") {
    fc.deck = currentFilteredPoly.length ? [...currentFilteredPoly] : getScopedPoly("all");
    fc.deck.sort((a, b) => (state.polyMastered.has(a.w) ? 1 : 0) - (state.polyMastered.has(b.w) ? 1 : 0) || b.count - a.count);
  } else {
    fc.deck = currentFilteredPhrases.length ? [...currentFilteredPhrases] : getScopedPhrases("all");
    fc.deck.sort((a, b) => (state.mastered.has(a.p) ? 1 : 0) - (state.mastered.has(b.p) ? 1 : 0) || b.count - a.count);
  }
  if (!fc.deck.length) return;
  fc.idx = 0; fc.flipped = false;
  document.body.classList.add("modal-open");
  fcModal.classList.add("open");
  fcModal.setAttribute("aria-hidden", "false");
  fcStats.active = true;
  fcStats.mode = fc.mode;
  fcStats.deckSize = fc.deck.length;
  fcStats.startTime = Date.now();
  fcStats.viewedSet = new Set([getFcItemKey(fc.deck[0])]);
  fcStats.flipsCount = 0;
  fcStats.masteredCount = 0;
  fcStats.starredCount = 0;
  fcStats.inputs = { touch: 0, click: 0, keyboard: 0 };
  trackEvent("flashcard_start", {
    mode: fc.mode,
    deck_size: fc.deck.length,
    status_filter: fc.mode === "poly" ? state.polyStatus : state.status,
  });
  renderFlashcard();
}

function closeFlashcards() {
  flushFlashcardSession(false, false);
  document.body.classList.remove("modal-open");
  fcModal.classList.remove("open");
  fcModal.setAttribute("aria-hidden", "true");
  render();
}

function renderFlashcard() {
  const it = fc.deck[fc.idx];
  if (!it) return;
  document.getElementById("fcCounter").textContent = `${fc.idx + 1} / ${fc.deck.length}`;
  const pill = document.getElementById("fcCatPill");
  const famHint = document.getElementById("fcFamHint");
  const polyNote = document.getElementById("fcPolyNote");
  const fcStarEl = document.getElementById("fcStar");

  if (fc.mode === "poly") {
    pill.className = "pill pill-three";
    pill.textContent = "熟词生义";
    document.getElementById("fcFreq").style.display = "none";
    document.getElementById("fcPhrase").textContent = it.w;
    famHint.style.display = "inline-block";
    famHint.textContent = `常见熟义：${it.fam}（请回想考研生义）`;
    const o = it.occs[0];
    document.getElementById("fcExample").innerHTML =
      `<span class="example-src src-${o[0]}">${o[0] === 1 ? "英一" : "英二"} ${o[1]} · ${escapeHtml(o[2])}</span>${highlightSentence(o[4], o[3])}`;
    document.getElementById("fcZh").textContent = `考研生义：${it.exm}`;
    polyNote.textContent = "";
    document.getElementById("fcMeta").textContent = "";
    const isStarred = state.polyStarred.has(it.w);
    fcStarEl.innerHTML = isStarred ? '★<span class="hide-sm"> 已收藏</span>' : '☆<span class="hide-sm"> 收藏</span>';
    fcStarEl.classList.toggle("starred", isStarred);
    document.getElementById("fcMaster").textContent = state.polyMastered.has(it.w) ? "恢复待背" : "斩掉（标熟）";
  } else {
    pill.className = `pill pill-${it.c}`;
    pill.textContent = catLabel(it.c);
    document.getElementById("fcFreq").style.display = "inline-flex";
    document.getElementById("fcFreq").textContent = `×${it.count}`;
    document.getElementById("fcPhrase").innerHTML = formatPhraseHtml(it.p);
    famHint.style.display = "none";
    const o = it.occs[0];
    document.getElementById("fcExample").innerHTML =
      `<span class="example-src src-${o[0]}">${o[0] === 1 ? "英一" : "英二"} ${o[1]} · ${escapeHtml(o[2])}</span>${highlightSentence(o[4], o[3])}`;
    document.getElementById("fcZh").textContent = it.z;
    polyNote.textContent = it.poly ? `熟词生义提示：熟义「${it.poly[0]}」→ 考研生义「${it.poly[1]}」` : "";
    document.getElementById("fcMeta").textContent = `真题频次：共 ${it.count} 次（英一 ${it.c1} · 英二 ${it.c2}）`;
    const isStarred = state.starred.has(it.p);
    fcStarEl.innerHTML = isStarred ? '★<span class="hide-sm"> 已收藏</span>' : '☆<span class="hide-sm"> 收藏</span>';
    fcStarEl.classList.toggle("starred", isStarred);
    document.getElementById("fcMaster").textContent = state.mastered.has(it.p) ? "恢复待背" : "斩掉（标熟）";
  }

  document.getElementById("fcAnswer").classList.toggle("visible", fc.flipped);
  document.getElementById("fcTapHint").style.display = fc.flipped ? "none" : "block";
}

document.getElementById("btnFlashcard").addEventListener("click", openFlashcards);
document.getElementById("fcClose").addEventListener("click", closeFlashcards);
fcModal.addEventListener("click", e => { if (e.target === fcModal) closeFlashcards(); });
let fcTouchStartX = 0, fcTouchStartY = 0, fcJustSwiped = false;
const fcBodyEl = document.getElementById("fcBody");
fcBodyEl.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;
  fcTouchStartX = e.touches[0].clientX;
  fcTouchStartY = e.touches[0].clientY;
  fcJustSwiped = false;
}, { passive: true });
fcBodyEl.addEventListener("touchend", e => {
  if (!e.changedTouches.length) return;
  const dx = e.changedTouches[0].clientX - fcTouchStartX;
  const dy = e.changedTouches[0].clientY - fcTouchStartY;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    fcJustSwiped = true;
    fc.idx = dx < 0 ? (fc.idx + 1) % fc.deck.length : (fc.idx - 1 + fc.deck.length) % fc.deck.length;
    fc.flipped = false;
    recordFcView("touch");
    renderFlashcard();
    setTimeout(() => { fcJustSwiped = false; }, 250);
  }
}, { passive: true });
fcBodyEl.addEventListener("click", () => {
  if (fcJustSwiped) return;
  fc.flipped = !fc.flipped;
  if (fc.flipped) fcStats.flipsCount++;
  fcStats.inputs.click++;
  renderFlashcard();
});
document.getElementById("fcPrev").addEventListener("click", () => { fc.idx = (fc.idx - 1 + fc.deck.length) % fc.deck.length; fc.flipped = false; recordFcView("click"); renderFlashcard(); });
document.getElementById("fcNext").addEventListener("click", () => { fc.idx = (fc.idx + 1) % fc.deck.length; fc.flipped = false; recordFcView("click"); renderFlashcard(); });
document.getElementById("fcStar").addEventListener("click", () => {
  const it = fc.deck[fc.idx]; if (!it) return;
  const key = fc.mode === "poly" ? it.w : it.p;
  const set = fc.mode === "poly" ? state.polyStarred : state.starred;
  const starred = !set.has(key);
  starred ? set.add(key) : set.delete(key);
  if (starred) fcStats.starredCount++;
  trackEvent("star_item", { mode: fc.mode, item: key, starred, source: "flashcard" });
  saveProgress(); renderFlashcard();
});
document.getElementById("fcMaster").addEventListener("click", () => {
  const it = fc.deck[fc.idx]; if (!it) return;
  const bodyEl = document.getElementById("fcBody");
  if (bodyEl.classList.contains("fc-exit")) return;
  const set = fc.mode === "poly" ? state.polyMastered : state.mastered;
  const key = fc.mode === "poly" ? it.w : it.p;
  if (set.has(key)) {
    set.delete(key);
    trackEvent("restore_item", { mode: fc.mode, item: key, source: "flashcard", item_freq_tier: getItemFreqTier(fc.mode, key) });
    saveProgress();
    renderFlashcard();
    return;
  }
  bodyEl.classList.add("fc-exit");
  setTimeout(() => {
    set.add(key);
    fcStats.masteredCount++;
    trackEvent("master_item", { mode: fc.mode, item: key, source: "flashcard", item_freq_tier: getItemFreqTier(fc.mode, key) });
    recordMasterMilestone();
    saveProgress();
    fc.deck.splice(fc.idx, 1);
    bodyEl.classList.remove("fc-exit");
    if (fc.deck.length === 0) {
      trackEvent("flashcard_complete", { mode: fc.mode, deck_size: fcStats.deckSize });
      flushFlashcardSession(true, false);
      closeFlashcards();
      showToast(`已斩「${key}」，本组全部完成`, () => {
        set.delete(key); saveProgress(); render();
      }, { mode: fc.mode, source: "flashcard", action: "master" });
      return;
    }
    if (fc.idx >= fc.deck.length) fc.idx = 0;
    fc.flipped = false;
    recordFcView();
    renderFlashcard();
    bodyEl.classList.add("fc-enter");
    bodyEl.addEventListener("animationend", () => bodyEl.classList.remove("fc-enter"), { once: true });
    showToast(`已斩「${key}」`, () => {
      set.delete(key); saveProgress(); render();
    }, { mode: fc.mode, source: "flashcard", action: "master" });
  }, 160);
});
document.addEventListener("keydown", e => {
  if (!fcModal.classList.contains("open")) return;
  if (e.key === "Escape") closeFlashcards();
  else if (e.key === " ") {
    e.preventDefault();
    fc.flipped = !fc.flipped;
    if (fc.flipped) fcStats.flipsCount++;
    fcStats.inputs.keyboard++;
    renderFlashcard();
  }
  else if (e.key === "ArrowRight") { fc.idx = (fc.idx + 1) % fc.deck.length; fc.flipped = false; recordFcView("keyboard"); renderFlashcard(); }
  else if (e.key === "ArrowLeft") { fc.idx = (fc.idx - 1 + fc.deck.length) % fc.deck.length; fc.flipped = false; recordFcView("keyboard"); renderFlashcard(); }
});

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    flushFlashcardSession(false, true);
    flushBlurSession(true);
  }
});
window.addEventListener("pagehide", () => {
  flushFlashcardSession(false, true);
  flushBlurSession(true);
});

if (location.hash === "#poly") {
  state.mod = "poly";
  document.querySelectorAll("#moduleNav .mod-btn").forEach(b => b.classList.toggle("active", b.dataset.mod === state.mod));
}
if (window.innerWidth <= 768) {
  document.getElementById("analyticsPanel").classList.remove("open");
  document.getElementById("analyticsChevron").textContent = "展开 ▾";
}
render();
initAnalyticsSession();
</script>
</body>
</html>
