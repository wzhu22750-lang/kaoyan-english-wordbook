<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>考研英语十年真题 · 动介短语 × 单词熟词生义</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Soft Editorial — Warm Cream Paper & Riso Pastel Accents */
    --paper: #F2EEDF;
    --paper-2: #ECE6D2;
    --bg: #F2EEDF;
    --bg-elevated: rgba(255, 255, 255, 0.58);
    --bg-solid: #F8F6EE;
    --bg-subtle: rgba(42, 36, 27, 0.06);
    --bg-hover: rgba(42, 36, 27, 0.1);
    --border: rgba(42, 36, 27, 0.16);
    --border-strong: rgba(42, 36, 27, 0.34);
    --ink: #2A241B;
    --ink-2: #5C5345;
    --ink-3: #7E7464;
    --pink: #E1A4C2;
    --lemon: #D6DD63;
    --blush: #E8C9B6;
    --sage: #B7C7A8;
    --lilac: #C9BEDC;
    --accent: #2A241B;
    --accent-soft: #D6DD63;
    --accent-border: rgba(42, 36, 27, 0.25);
    --accent-ink: #2A241B;
    --inv-ink: #F2EEDF;
    --mark-bg: rgba(214, 221, 99, 0.55);
    --mark-ink: #2A241B;
    --shadow-sm: none;
    --shadow-md: 0 8px 28px rgba(42, 36, 27, 0.05);
    --shadow-lg: 0 24px 60px rgba(42, 36, 27, 0.18);
    --radius: 24px;
    --radius-sm: 14px;
    --font-sans: "Work Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-serif: "Cormorant Garamond", "Garamond", "Georgia", "Songti SC", "STSong", serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }

  [data-theme="dark"] {
    /* Soft Editorial Warm Espresso Night Mode */
    --paper: #1D1A15;
    --paper-2: #25211B;
    --bg: #1D1A15;
    --bg-elevated: rgba(255, 250, 238, 0.06);
    --bg-solid: #26221C;
    --bg-subtle: rgba(242, 238, 223, 0.08);
    --bg-hover: rgba(242, 238, 223, 0.13);
    --border: rgba(242, 238, 223, 0.14);
    --border-strong: rgba(242, 238, 223, 0.3);
    --ink: #F2EEDF;
    --ink-2: #BEB5A4;
    --ink-3: #8D8475;
    --pink: #B87B98;
    --lemon: #B4BC4A;
    --blush: #BD9D8A;
    --sage: #8DA07E;
    --lilac: #9C91B3;
    --accent: #F2EEDF;
    --accent-soft: rgba(214, 221, 99, 0.22);
    --accent-border: rgba(242, 238, 223, 0.26);
    --accent-ink: #F2EEDF;
    --inv-ink: #1D1A15;
    --mark-bg: rgba(214, 221, 99, 0.28);
    --mark-ink: #F2EEDF;
    --shadow-sm: none;
    --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
  }

  button, input, select {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  body.modal-open { overflow: hidden; }

  .stat-value, .badge-num, .cnt, .freq-badge, .bar-num, #fcCounter, .ms-num, .ms-pct {
    font-variant-numeric: tabular-nums;
  }

  .brand h1, .fc-phrase { text-wrap: balance; }
  .zh-meaning, .poly-row-exm { text-wrap: pretty; }

  .show-sm { display: none; }
  .mob-only-meta { display: none; }

  .btn:active, .icon-btn:active, .seg-btn:active, .mod-btn:active, .scope-btn:active {
    transform: scale(0.96);
  }

  .container {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px 84px;
  }

  /* Header */
  header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px dashed var(--border);
  }

  .header-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand-title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-swatches {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .brand-swatches i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    display: block;
  }

  .brand h1 {
    font-family: var(--font-serif);
    font-size: 25px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1;
  }

  .module-nav {
    display: inline-flex;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
  }

  .mod-btn {
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background-color 0.16s ease, color 0.16s ease;
  }
  .mod-btn:hover { color: var(--ink); }
  .mod-btn.active {
    background: var(--lemon);
    color: #2A241B;
    font-weight: 600;
  }
  .mod-btn .badge-num {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13px;
    opacity: 0.78;
  }

  .scope-switch {
    display: inline-flex;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }

  .scope-btn {
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .scope-btn.active {
    background: var(--blush);
    color: #2A241B;
    font-weight: 600;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.15s ease, border-color 0.15s ease;
  }
  .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
  .btn.active {
    background: var(--pink);
    border-color: transparent;
    color: #2A241B;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--lemon);
    border-color: transparent;
    color: #2A241B;
    font-weight: 600;
  }
  .btn-primary:hover {
    filter: brightness(0.95);
    color: #2A241B;
  }

  .icon { width: 15px; height: 15px; flex-shrink: 0; }

  /* Mobile Compact Progress Summary (hidden on desktop) */
  .mobile-summary {
    display: none;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 11px 14px;
    margin: 12px 0 10px;
    flex-direction: column;
    gap: 7px;
  }
  .mobile-summary-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .ms-left {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
  }
  .ms-num {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1;
  }
  .ms-pct {
    margin-left: 4px;
    font-weight: 600;
    font-size: 11.5px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--sage);
    color: #2A241B;
  }
  .ms-right {
    font-size: 12px;
    color: var(--ink-3);
    white-space: nowrap;
  }

  /* Stats Hero Strip — Soft Editorial 4-Pastel Riso Cards */
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin: 26px 0 22px;
  }

  .stat-card {
    background: var(--bg-elevated);
    border: none;
    border-radius: 26px;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 8px;
    color: #2A241B;
  }
  .stat-card:nth-child(1) { background: var(--lemon); }
  .stat-card:nth-child(2) { background: var(--blush); }
  .stat-card:nth-child(3) { background: var(--sage); }
  .stat-card:nth-child(4) { background: var(--pink); }

  .stat-label {
    font-size: 12px;
    color: rgba(42, 36, 27, 0.72);
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .stat-value {
    font-family: var(--font-serif);
    font-size: 44px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: #2A241B;
    line-height: 0.95;
    margin: 2px 0;
  }

  .stat-sub {
    font-size: 12px;
    color: rgba(42, 36, 27, 0.76);
  }

  .progress-bar-track {
    height: 5px;
    border-radius: 99px;
    background: rgba(42, 36, 27, 0.14);
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-bar-fill {
    height: 100%;
    background: #2A241B;
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  /* Analytics Panel */
  .analytics-panel {
    background: var(--bg-elevated);
    border: none;
    border-radius: var(--radius);
    margin-bottom: 20px;
    overflow: hidden;
  }

  .analytics-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 24px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px dashed transparent;
  }
  .analytics-panel.open .analytics-head { border-bottom-color: var(--border); }

  .analytics-title {
    font-family: var(--font-serif);
    font-size: 19px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .analytics-body {
    display: none;
    padding: 18px 24px 22px;
  }
  .analytics-panel.open .analytics-body { display: block; }

  .analytics-grid {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 28px;
  }

  .chart-bars {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px 20px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 124px 1fr 28px;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 999px;
    transition: background 0.14s;
  }
  .bar-row:hover { background: var(--bg-subtle); }

  .bar-name {
    font-family: var(--font-serif);
    font-size: 15.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar-track {
    height: 8px;
    background: rgba(42, 36, 27, 0.08);
    border-radius: 999px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--sage);
  }
  .bar-row:nth-child(4n+1) .bar-fill { background: var(--pink); }
  .bar-row:nth-child(4n+2) .bar-fill { background: var(--lemon); }
  .bar-row:nth-child(4n+3) .bar-fill { background: var(--blush); }
  .bar-row:nth-child(4n+4) .bar-fill { background: var(--sage); }

  .bar-num {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 14px;
    color: var(--ink-2);
    text-align: right;
  }

  .mini-heading {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-2);
    margin-bottom: 10px;
  }

  .family-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .family-chip {
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background-color 0.14s ease;
  }
  .family-chip span {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 12.5px;
    color: var(--ink-3);
  }
  .family-chip:hover { background: var(--paper-2); }
  .family-chip.active {
    background: var(--lemon);
    border-color: transparent;
    color: #2A241B;
    font-weight: 600;
  }
  .family-chip.active span { color: rgba(42, 36, 27, 0.72); }

  /* Controls Bar — Single Calm Primary Row + Collapsible Advanced Drawer */
  .controls {
    background: var(--bg-elevated);
    border: none;
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .controls-drawer {
    display: none;
    flex-direction: column;
    gap: 12px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .controls-drawer.open {
    display: flex;
  }

  .filter-toggle-btn {
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background-color 0.14s ease, color 0.14s ease;
  }
  .filter-toggle-btn:hover { background: var(--paper-2); color: var(--ink); }
  .filter-toggle-btn.has-active {
    background: var(--sage);
    border-color: transparent;
    color: #2A241B;
    font-weight: 600;
  }

  .search-box {
    position: relative;
    flex: 1;
    min-width: 220px;
  }

  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-3);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    font-size: 13.5px;
    padding: 9px 34px 9px 38px;
    border-radius: 999px;
    outline: none;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .search-input:focus { border-color: var(--border-strong); background: var(--bg-solid); }

  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    padding: 4px;
    display: none;
    font-size: 16px;
    line-height: 1;
  }
  .search-clear.visible { display: block; }

  .seg-group {
    display: inline-flex;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
    flex-wrap: wrap;
  }

  .seg-btn {
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.14s ease, color 0.14s ease;
  }
  .seg-btn:hover { color: var(--ink); }
  .seg-btn.active {
    background: var(--blush);
    color: #2A241B;
    font-weight: 600;
  }
  .seg-btn .cnt {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 12.5px;
    opacity: 0.72;
    margin-left: 4px;
  }

  .toggle-pill {
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink-2);
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background-color 0.14s ease;
  }
  .toggle-pill:hover { border-color: var(--border-strong); color: var(--ink); }
  .toggle-pill.active-crimson {
    background: var(--pink);
    border-color: transparent;
    color: #2A241B;
    font-weight: 600;
  }
  .toggle-pill.active-plum {
    background: var(--lilac);
    border-color: transparent;
    color: #2A241B;
    font-weight: 600;
  }

  .select-ctrl {
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    font-size: 12.5px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }

  .prep-strip {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
  }

  .prep-chip {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 500;
    padding: 4px 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.14s ease;
  }
  .prep-chip:hover { background: var(--paper-2); color: var(--ink); }
  .prep-chip.active {
    background: var(--sage);
    border-color: transparent;
    color: #2A241B;
    font-weight: 600;
  }

  .results-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--ink-2);
    gap: 12px;
    flex-wrap: wrap;
  }

  .reset-link {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    margin-left: 10px;
  }

  /* Wordbook Grid — Generous Editorial Whitespace */
  .word-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
  }
  .word-grid.list-view {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .word-card {
    background: color-mix(in srgb, var(--paper) 55%, #ffffff 45%);
    border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
    border-radius: 20px;
    padding: 22px 26px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(42, 36, 27, 0.028);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.24s ease, box-shadow 0.32s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.18s ease;
    will-change: transform, opacity;
  }
  [data-theme="dark"] .word-card {
    background: var(--bg-elevated);
    border-color: var(--border);
    box-shadow: none;
  }
  .word-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--sage);
    opacity: 0.85;
  }
  .word-card[data-tone="high"]::before { background: var(--lemon); }
  .word-card[data-tone="mid"]::before  { background: var(--blush); }
  .word-card[data-tone="poly"]::before { background: var(--pink); }
  .word-card[data-tone="low"]::before  { background: var(--sage); }

  @media (hover: hover) {
    .word-card:hover {
      transform: translate3d(0, -3px, 0);
      border-color: color-mix(in srgb, var(--ink) 20%, transparent);
      box-shadow: 0 14px 34px rgba(42, 36, 27, 0.075);
    }
    [data-theme="dark"] .word-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md);
    }
  }
  .word-card.mastered {
    border: 1px dashed var(--border-strong);
    box-shadow: none;
  }
  .word-card.mastered::before { opacity: 0.3; }
  .word-card.mastered .phrase-text { opacity: 0.55; }

  /* Silky Ink-Slash ("斩") Animation — Soft Editorial Edition */
  .slash-btn {
    height: 29px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-serif);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease, transform 0.12s ease;
  }
  .slash-btn:hover {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--inv-ink);
  }
  .slash-btn:active {
    transform: scale(0.94);
  }
  .slash-btn.restore-btn {
    font-family: var(--font-sans);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .slash-btn.restore-btn:hover {
    background: var(--sage);
    border-color: transparent;
    color: #2A241B;
  }

  .slash-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--paper) 65%, transparent);
    opacity: 0;
    animation: slashBgIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .slash-line {
    position: absolute;
    width: 145%;
    height: 2px;
    background: var(--ink);
    transform: rotate(-16deg) scaleX(0);
    transform-origin: left center;
    animation: inkSweep 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .slash-stamp {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.14em;
    padding: 5px 18px 5px 20px;
    border-radius: 999px;
    background: var(--lemon);
    color: #2A241B;
    transform: scale(1.2) rotate(-5deg);
    opacity: 0;
    animation: stampDrop 0.22s 0.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes slashBgIn {
    to { opacity: 1; }
  }
  @keyframes inkSweep {
    0%   { transform: rotate(-16deg) scaleX(0); opacity: 0.6; }
    65%  { transform: rotate(-16deg) scaleX(1); opacity: 1; }
    100% { transform: rotate(-16deg) scaleX(1); opacity: 0.85; }
  }
  @keyframes stampDrop {
    to { transform: scale(1) rotate(-6deg); opacity: 1; }
  }

  .word-card.is-slashing {
    pointer-events: none;
    border-color: var(--ink);
    transform: translate3d(0, 0, 0) scale(0.985);
    transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.18s ease;
  }
  .word-card.is-vanishing {
    pointer-events: none;
    opacity: 0;
    transform: translate3d(0, -14px, 0) scale(0.93);
    transition: opacity 0.24s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .word-card.is-entering {
    animation: cardEnter 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes cardEnter {
    from { opacity: 0; transform: translate3d(0, 12px, 0) scale(0.96); }
    to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  /* Flashcard transition */
  .fc-body.fc-exit {
    opacity: 0;
    transform: translate3d(-22px, 0, 0) scale(0.975);
    transition: opacity 0.15s cubic-bezier(0.4, 0, 1, 1), transform 0.15s cubic-bezier(0.4, 0, 1, 1);
  }
  .fc-body.fc-enter {
    animation: fcSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes fcSlideIn {
    from { opacity: 0; transform: translate3d(20px, 0, 0) scale(0.985); }
    to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  /* Sonner-style Monochrome Undo Toast */
  .toast-host {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(18px);
    z-index: 120;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .toast-host.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .toast-pill {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: #2A241B;
    color: #F2EEDF;
    border-radius: 999px;
    padding: 10px 14px 10px 18px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: 0 12px 32px rgba(42, 36, 27, 0.25);
    white-space: nowrap;
  }
  .toast-undo {
    border: none;
    background: var(--lemon);
    color: #2A241B;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .toast-undo:hover {
    filter: brightness(0.92);
  }

  @media (prefers-reduced-motion: reduce) {
    .word-card, .slash-overlay, .slash-line, .slash-stamp, .toast-host {
      animation: none !important;
      transition: none !important;
    }
  }

  .card-header-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "meta actions"
      "phrase phrase";
    align-items: center;
    gap: 10px 12px;
  }
  .card-header-grid .card-eyebrow-meta { grid-area: meta; min-height: 28px; }
  .card-header-grid .card-right { grid-area: actions; }
  .card-header-grid .phrase-block { grid-area: phrase; min-width: 0; }

  .card-eyebrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 28px;
  }
  .card-eyebrow-meta {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-3);
    flex-wrap: wrap;
  }

  .card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }

  .phrase-block {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .phrase-text {
    font-family: var(--font-serif);
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -0.018em;
    color: var(--ink);
    line-height: 1.06;
  }
  .phrase-prep {
    color: var(--ink-2);
    font-style: italic;
    font-weight: 400;
    text-decoration: none;
  }
  .word-pos-pill {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-2);
    background: var(--bg-subtle);
    padding: 1px 9px;
    border-radius: 999px;
    vertical-align: 3px;
  }

  .card-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .freq-badge {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 13.5px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    border: 1px solid transparent;
  }
  .freq-high { background: var(--lemon); color: #2A241B; }
  .freq-mid  { background: var(--blush); color: #2A241B; }
  .freq-low  { background: var(--bg-subtle); color: var(--ink-2); }

  .icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-3);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.14s ease, color 0.14s ease;
  }
  .icon-btn:hover { background: var(--bg-subtle); color: var(--ink); }
  .icon-btn.starred { color: #2A241B; background: var(--lemon); }
  .icon-btn.checked { color: #2A241B; background: var(--sage); }

  .zh-meaning {
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--ink);
    padding: 2px 0;
    transition: filter 0.2s ease, opacity 0.2s ease;
  }

  /* Quiet Editorial Card Footer */
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 11px;
    margin-top: auto;
    border-top: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
    font-size: 12px;
    color: var(--ink-3);
    flex-wrap: wrap;
  }

  .card-foot-meta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .pill {
    font-size: 11.5px;
    font-weight: 500;
    padding: 3px 11px;
    border-radius: 999px;
    background: var(--paper);
    color: var(--ink-2);
    border: 1px solid var(--border);
  }
  .pill-phrasal { background: var(--sage); color: #2A241B; border-color: transparent; }
  .pill-prep    { background: var(--blush); color: #2A241B; border-color: transparent; }
  .pill-three   { background: var(--lilac); color: #2A241B; border-color: transparent; }

  .cloze-dot-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--pink);
    color: #2A241B;
    font-size: 11px;
    font-weight: 600;
    padding: 1px 9px;
    border-radius: 999px;
  }

  .ex-toggle-btn {
    border: none;
    background: transparent;
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 6px;
    transition: color 0.14s ease, background-color 0.14s ease;
  }
  .ex-toggle-btn:hover {
    color: var(--ink);
    background: var(--bg-subtle);
  }

  /* Polysemy Contrast — Crisp Editorial Contrast Box */
  .poly-callout {
    background: color-mix(in srgb, var(--paper) 84%, transparent);
    border: 1px solid color-mix(in srgb, var(--ink) 8%, transparent);
    border-radius: 13px;
    padding: 11px 14px;
    font-size: 13px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .poly-row-fam {
    color: var(--ink-3);
    font-size: 12.5px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .poly-row-exm {
    color: var(--ink);
    font-weight: 500;
    font-size: 15px;
    display: flex;
    align-items: baseline;
    gap: 8px;
    transition: filter 0.2s ease, opacity 0.2s ease;
  }
  .poly-tag-lbl {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 10.5px;
    font-weight: 600;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--bg-subtle);
    color: var(--ink-3);
  }
  .poly-row-exm .poly-tag-lbl {
    background: var(--lemon);
    color: #2A241B;
  }

  body.blur-mode .zh-meaning:not(.revealed),
  body.blur-mode .poly-row-exm:not(.revealed) {
    filter: blur(6px);
    opacity: 0.4;
    cursor: pointer;
    user-select: none;
  }
  @media (hover: hover) {
    body.blur-mode .zh-meaning:not(.revealed):hover,
    body.blur-mode .poly-row-exm:not(.revealed):hover {
      filter: blur(0);
      opacity: 1;
    }
  }

  .examples-drawer {
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding-top: 2px;
    animation: exReveal 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes exReveal {
    from { opacity: 0; transform: translate3d(0, -6px, 0); }
    to   { opacity: 1; transform: translate3d(0, 0, 0); }
  }

  .example-box {
    background: color-mix(in srgb, var(--paper) 82%, transparent);
    border: 1px solid color-mix(in srgb, var(--ink) 7%, transparent);
    border-left: 2.5px solid var(--blush);
    border-radius: 12px;
    padding: 11px 14px;
    font-family: var(--font-serif);
    font-size: 15.5px;
    line-height: 1.62;
    color: var(--ink-2);
  }

  .example-src {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--paper);
    color: var(--ink-2);
    margin-right: 7px;
    vertical-align: 1px;
  }
  .src-1 { background: var(--paper); color: var(--ink-2); }
  .src-2 { background: var(--paper); color: var(--ink-2); }

  mark.hl {
    background: var(--mark-bg);
    color: var(--mark-ink);
    font-weight: 600;
    padding: 0 5px;
    border-radius: 5px;
    border-bottom: 1.5px solid color-mix(in srgb, var(--ink) 22%, transparent);
  }

  .more-occ-btn {
    align-self: flex-start;
    border: none;
    background: transparent;
    color: var(--ink-3);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 0;
  }
  .more-occ-btn:hover { color: var(--accent); }

  .extra-examples {
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  /* ================= Cloze Practice Cards ================= */
  .cloze-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .cloze-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .cloze-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .cloze-head-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .cloze-q-id {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 6px;
  }

  .cloze-sent {
    font-family: var(--font-serif);
    font-size: 16.5px;
    line-height: 1.75;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
  }

  .blank-pill {
    display: inline-block;
    min-width: 72px;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    padding: 1px 10px;
    margin: 0 3px;
    border-radius: 6px;
    border: 1.5px dashed var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
  }
  .blank-pill.filled {
    border-style: solid;
    border-color: var(--sage);
    background: var(--sage-soft);
    color: var(--sage);
    font-family: var(--font-serif);
    font-size: 16px;
  }

  .cloze-opts {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }

  .cloze-opt-btn {
    text-align: left;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.14s ease, background-color 0.14s ease, color 0.14s ease;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cloze-opt-btn:hover {
    border-color: var(--border-strong);
    background: var(--bg-hover);
  }
  .cloze-opt-btn.is-correct {
    border-color: var(--sage);
    background: var(--sage-soft);
    color: var(--sage);
  }
  .cloze-opt-btn.is-wrong {
    border-color: var(--crimson);
    background: var(--crimson-soft);
    color: var(--crimson);
  }

  .opt-main {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 700;
  }
  .opt-let {
    font-family: var(--font-mono);
    font-size: 12px;
    opacity: 0.7;
  }
  .opt-gloss {
    font-size: 12px;
    color: var(--ink-2);
    line-height: 1.4;
  }
  .cloze-opt-btn.is-correct .opt-gloss { color: var(--sage); font-weight: 600; }

  .cloze-explain {
    border-top: 1px dashed var(--border-strong);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13.5px;
  }

  /* Pagination & Empty */
  .load-more-wrap {
    display: flex;
    justify-content: center;
    margin-top: 24px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 56px 20px;
    color: var(--ink-3);
    background: var(--bg-elevated);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
  }

  /* Flashcard Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(20, 18, 15, 0.62);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }

  .flashcard-shell {
    width: 100%;
    max-width: 840px;
    background: var(--bg-solid);
    border: 1px solid var(--border);
    border-radius: 28px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .fc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--ink-2);
  }

  .fc-body {
    padding: 0;
    min-height: 310px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    cursor: pointer;
  }

  .fc-left-pane {
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    gap: 14px;
    min-width: 0;
  }

  .fc-right-pane {
    padding: 32px 28px;
    border-left: 1px solid var(--border);
    background: color-mix(in srgb, var(--paper) 55%, transparent);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    min-width: 0;
  }
  [data-theme="dark"] .fc-right-pane {
    background: rgba(242, 238, 223, 0.03);
  }
  .fc-right-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--ink-3);
    text-transform: uppercase;
  }

  .fc-phrase {
    font-family: var(--font-serif);
    font-size: 44px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.06;
  }

  .fc-fam-hint {
    font-size: 13px;
    color: var(--ink-2);
    background: var(--bg-subtle);
    padding: 4px 12px;
    border-radius: 99px;
  }

  .fc-example {
    font-family: var(--font-serif);
    font-size: 17px;
    color: var(--ink-2);
    background: transparent;
    border: none;
    border-left: 2.5px solid var(--blush);
    border-radius: 0;
    padding: 2px 0 2px 14px;
    text-align: left;
    line-height: 1.65;
  }

  .fc-answer {
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px dashed var(--border-strong);
    width: 100%;
    display: none;
    flex-direction: column;
    gap: 6px;
  }
  .fc-answer.visible { display: flex; }

  .fc-zh {
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
  }

  .fc-hint {
    font-size: 12px;
    color: var(--ink-3);
  }

  .fc-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 22px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .fc-actions { display: flex; gap: 8px; }

  @media (max-width: 960px) {
    .stats-strip { grid-template-columns: repeat(2, 1fr); }
    .analytics-grid { grid-template-columns: 1fr; }
    .word-grid { grid-template-columns: 1fr; }
    .cloze-opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (max-width: 768px) {
    .hide-sm { display: none !important; }
    .show-sm { display: inline; }
    .desk-only-meta, .desk-freq { display: none !important; }
    .mob-only-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .container {
      padding: 0 14px calc(56px + env(safe-area-inset-bottom));
    }

    /* Compact 2-row sticky header */
    .header-inner {
      padding: max(8px, env(safe-area-inset-top)) 14px 9px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "title actions"

      clozePicks: state.clozePicks,
      theme: document.documentElement.getAttribute("data-theme") || "light",
    }));
  } catch (e) {}

function isRecent10(examNum, year) {
  return examNum === 1 ? (year >= 2016 && year <= 2025) : (year >= 2015 && year <= 2024);
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function highlightSentence(sentence, surface) {
  const escSent = escapeHtml(sentence);
  const escSurf = escapeHtml(surface);
  const re = new RegExp(escSurf.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
  return escSent.replace(re, m => `<mark class="hl">${m}</mark>`);
}

function formatPhraseHtml(phrase) {
  const parts = phrase.split(" ");
  return `${escapeHtml(parts[0])} <span class="phrase-prep">${escapeHtml(parts.slice(1).join(" "))}</span>`;
}

function catLabel(c) {
  return c === "phrasal" ? "短语动词" : (c === "three" ? "三词短语" : "动介搭配");
}

function speakText(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

// ==================== Scoped Data Helpers ====================
function getScopedPhrases(examFilter = state.exam) {
  const secRank = s => (s === "完形挖空" ? 0 : (s === "写作" ? 2 : 1));
  const out = [];
  for (const it of BUNDLE.phrases) {
    const occs = it.o.filter(o => {
      if (state.scope === "10y" && !isRecent10(o[0], o[1])) return false;
      if (examFilter !== "all" && String(o[0]) !== examFilter) return false;
      return true;
    });
    if (!occs.length) continue;
    const cz = (it.cz || []).filter(c => {
      if (state.scope === "10y" && !isRecent10(c[0], c[1])) return false;
      if (examFilter !== "all" && String(c[0]) !== examFilter) return false;
      return true;
    });
    let c1 = 0, c2 = 0, maxY = 0;
    for (const o of occs) {
      if (o[0] === 1) c1++; else c2++;
      if (o[1] > maxY) maxY = o[1];
    }
    occs.sort((a, b) => secRank(a[2]) - secRank(b[2]) || b[1] - a[1] || a[0] - b[0]);
    out.push({ ...it, occs, czScoped: cz, count: occs.length, c1, c2, maxY });
  }
  return out;
}

function getScopedCloze(examFilter = state.clozeExam) {
  return BUNDLE.cloze.filter(q => {
    if (state.scope === "10y" && !isRecent10(q.exam, q.year)) return false;
    if (examFilter !== "all" && String(q.exam) !== examFilter) return false;
    return true;
  });
}

function getScopedPoly(examFilter = state.polyExam) {
  const out = [];
  for (const it of BUNDLE.polysemy) {
    const occs = it.o.filter(o => {
      if (state.scope === "10y" && !isRecent10(o[0], o[1])) return false;
      if (examFilter !== "all" && String(o[0]) !== examFilter) return false;
      return true;
    });
    if (!occs.length) continue;
    let c1 = 0, c2 = 0, maxY = 0;
    for (const o of occs) {
      if (o[0] === 1) c1++; else c2++;
      if (o[1] > maxY) maxY = o[1];
    }
    out.push({ ...it, occs, count: occs.length, c1, c2, maxY });
  }
  return out;
}

let currentFilteredPhrases = [];
let currentFilteredPoly = [];

function render() {
  const allP = getScopedPhrases("all");
  const allY = getScopedPoly("all");
  document.getElementById("navCntPhrases").textContent = allP.length;
  document.getElementById("navCntPoly").textContent = allY.length;

  document.getElementById("viewPhrases").style.display = state.mod === "phrases" ? "" : "none";
  document.getElementById("viewPoly").style.display = state.mod === "poly" ? "" : "none";

  if (state.mod === "phrases") renderPhrases();
  else renderPoly();
}

function renderPhrases() {
  const scoped = getScopedPhrases(state.exam);
  const q = state.search.trim().toLowerCase();

  const filtered = scoped.filter(it => {
    if (state.hardOnly && it.hard === 0) return false;
    if (state.cat !== "all" && it.c !== state.cat) return false;
    if (state.clozeOnly && it.czScoped.length === 0) return false;
    if (state.polyOnly && !it.poly) return false;
    if (state.prep !== "all" && it.m !== state.prep && it.r !== state.prep) return false;
    if (state.verb !== "all" && it.v !== state.verb) return false;
    if (state.status === "mastered" && !state.mastered.has(it.p)) return false;
    if (state.status === "unmastered" && state.mastered.has(it.p)) return false;
    if (state.status === "starred" && !state.starred.has(it.p)) return false;
    if (state.freqMin === "1") { if (it.count !== 1) return false; }
    else if (state.freqMin !== "all") { if (it.count < Number(state.freqMin)) return false; }
    if (q) {
      const hitBasic = it.p.includes(q) || it.z.toLowerCase().includes(q) || (it.poly && (it.poly[0].includes(q) || it.poly[1].includes(q)));
      const hitYear = /^\d{4}$/.test(q) && it.occs.some(o => String(o[1]) === q);
      if (!hitBasic && !hitYear) return false;
    }
    return true;
  });

  if (state.sort === "freq") filtered.sort((a, b) => b.count - a.count || a.p.localeCompare(b.p));
  else if (state.sort === "alpha") filtered.sort((a, b) => a.p.localeCompare(b.p));
  else if (state.sort === "prep") filtered.sort((a, b) => a.r.localeCompare(b.r) || b.count - a.count);
  else if (state.sort === "recent") filtered.sort((a, b) => b.maxY - a.maxY || b.count - a.count);

  currentFilteredPhrases = filtered;

  // Stats
  const catCnt = { phrasal: 0, prep: 0, three: 0 };
  let totalOcc = 0, c1 = 0, c2 = 0, masteredCnt = 0, starredCnt = 0, clozeCnt = 0, polyCnt = 0;
  for (const it of scoped) {
    catCnt[it.c]++;
    totalOcc += it.count; c1 += it.c1; c2 += it.c2;
    if (state.mastered.has(it.p)) masteredCnt++;
    if (state.starred.has(it.p)) starredCnt++;
    if (it.czScoped.length) clozeCnt++;

    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;

  document.getElementById("statsStrip").innerHTML = `

      <div class="stat-label"><span>收录动介词组</span><span>${scopeTxt}</span></div>

    </div>
    <div class="stat-card">
      <div class="stat-label"><span>真题出现总频次</span><span>完形直接挖空 ${clozeCnt} 词</span></div>
      <div class="stat-value">${totalOcc.toLocaleString()}</div>

    <div class="stat-card">
      <div class="stat-label"><span>已斩进度</span><span>${pct}%</span></div>
      <div class="stat-value">${masteredCnt}</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span>重点收藏 / 生义陷阱</span><span>本地自动保存</span></div>
      <div class="stat-value">${starredCnt}</div>
      <div class="stat-sub">含熟词生义陷阱词组：${polyCnt} 个</div>
    </div>`;

  document.getElementById("cntAll").textContent = scoped.length;

  const chartSource = scoped
    .filter(it => (!state.hardOnly || it.hard !== 0) && (state.cat === "all" || it.c === state.cat) && (!state.clozeOnly || it.czScoped.length) && (!state.polyOnly || it.poly) && (state.status !== "unmastered" || !state.mastered.has(it.p)))
    .sort((a, b) => b.count - a.count || a.p.localeCompare(b.p))
    .slice(0, 16);
  const maxFreq = chartSource.length ? chartSource[0].count : 1;
  document.getElementById("chartHeading").textContent =
    `TOP ${chartSource.length} 高频${state.cat === "all" ? "词组" : catLabel(state.cat)}`;
  document.getElementById("chartBars").innerHTML = chartSource.map(it => {
    const w = Math.max(8, Math.round((it.count / maxFreq) * 100));
    return `<div class="bar-row" data-jump="${escapeHtml(it.p)}" title="${escapeHtml(it.z)}">
      <div class="bar-name">${escapeHtml(it.p)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div>
      <div class="bar-num">${it.count}</div>
    </div>`;
  }).join("");

  // Verb families
  const vMap = new Map();
  for (const it of scoped) {
    if (state.cat !== "all" && it.c !== state.cat) continue;
    vMap.set(it.v, (vMap.get(it.v) || 0) + 1);
  }
  const topV = [...vMap.entries()].filter(([, n]) => n >= 3).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 18);
  document.getElementById("verbFamilyChips").innerHTML = [
    `<button class="family-chip ${state.verb === "all" ? "active" : ""}" data-verb="all">全部动词</button>`,
    ...topV.map(([v, n]) => `<button class="family-chip ${state.verb === v ? "active" : ""}" data-verb="${v}">${v} <span>${n}</span></button>`),
  ].join("");

  // Preps
  const pMap = new Map();
  for (const it of scoped) {
    if (state.cat !== "all" && it.c !== state.cat) continue;
    pMap.set(it.m, (pMap.get(it.m) || 0) + 1);
  }
  const topP = [...pMap.entries()].sort((a, b) => b[1] - a[1]).slice(0, 18);
  document.getElementById("prepStrip").innerHTML = [
    `<button class="prep-chip ${state.prep === "all" ? "active" : ""}" data-prep="all">全部介词</button>`,
    ...topP.map(([pr, n]) => `<button class="prep-chip ${state.prep === pr ? "active" : ""}" data-prep="${pr}">${pr} · ${n}</button>`),
  ].join("");

  const hasFilter = state.cat !== "all" || state.exam !== "all" || state.status !== "unmastered" ||
    state.freqMin !== "all" || state.prep !== "all" || state.verb !== "all" ||
    state.search.trim() !== "" || state.clozeOnly || state.polyOnly;
  document.getElementById("btnReset").style.display = hasFilter ? "inline" : "none";

  // Count active secondary filters in the drawer
  const advCnt = (state.clozeOnly ? 1 : 0) + (state.polyOnly ? 1 : 0) + (state.exam !== "all" ? 1 : 0) +
    (state.freqMin !== "all" ? 1 : 0) + (state.prep !== "all" ? 1 : 0) + (state.sort !== "freq" ? 1 : 0);
  const fBtn = document.getElementById("btnFilterDrawer");
  fBtn.classList.toggle("has-active", advCnt > 0);
  document.getElementById("filterActiveCount").textContent = advCnt > 0 ? `(${advCnt}) ` : "";
  document.getElementById("btnShowExAll").textContent = state.showExamples ? "收起例句 ▴" : "显示例句 ▾";

  const filtTotal = filtered.reduce((s, x) => s + x.count, 0);
  document.getElementById("resultsCount").innerHTML =
    `共 ${filtered.length} 个词组<span class="hide-sm"> · 累计 ${filtTotal} 次真题出现</span>`;

  renderPhraseCards(filtered);
}

function renderPhraseCards(list) {
  const grid = document.getElementById("wordGrid");
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">没有匹配的词组，试试放宽筛选条件。</div>`;
    document.getElementById("loadMoreWrap").style.display = "none";
    return;
  }
  const slice = list.slice(0, state.shown);
  grid.innerHTML = slice.map(it => {
    const isM = state.mastered.has(it.p);
    const isS = state.starred.has(it.p);
    const isExp = state.expanded.has(it.p);
    const showAnyEx = state.showExamples || isExp;
    const freqClass = it.count >= 8 ? "freq-high" : (it.count >= 3 ? "freq-mid" : "freq-low");

    const splitParts = [
      catLabel(it.c),
      [it.c1 > 0 ? `英一 ${it.c1}` : "", it.c2 > 0 ? `英二 ${it.c2}` : ""].filter(Boolean).join(" / "),
    ].filter(Boolean).join(" · ");

    let clozeBadgeHtml = "";
    if (it.czScoped.length > 0) {
      const hasAns = it.czScoped.some(c => c[3] === 1);
      clozeBadgeHtml = `<span class="cloze-dot-tag">${hasAns ? "完形正解" : "完形选项"}</span>`;
    }

    const polyHtml = it.poly ? `
      <div class="poly-callout">
        <div class="poly-row-fam"><span class="poly-tag-lbl">熟义</span>${escapeHtml(it.poly[0])}</div>
        <div class="poly-row-exm"><span class="poly-tag-lbl">生义</span>${escapeHtml(it.poly[1])}</div>
      </div>` : "";

    const shownOccs = isExp ? it.occs : (state.showExamples ? it.occs.slice(0, 1) : []);
    const examplesHtml = shownOccs.length ? `
      <div class="examples-drawer">
        ${shownOccs.map(o => `
          <div class="example-box">
            <span class="example-src src-${o[0]}">${o[0] === 1 ? "英一" : "英二"} ${o[1]} · ${escapeHtml(o[2])}</span>
            ${highlightSentence(o[4], o[3])}
          </div>`).join("")}
      </div>` : "";

    const tone = it.poly ? "poly" : (it.count >= 8 ? "high" : (it.count >= 3 ? "mid" : "low"));

    return `
      <article class="word-card ${isM ? "mastered" : ""}" data-tone="${tone}" data-key="${escapeHtml(it.p)}">
        <div class="card-header-grid">
          <div class="card-eyebrow-meta">
            <span>${splitParts}</span>
            ${clozeBadgeHtml}
          </div>
          <div class="card-right">
            <span class="freq-badge ${freqClass} desk-freq">×${it.count}</span>
            <button class="icon-btn ${isS ? "starred" : ""}" data-star="${escapeHtml(it.p)}" title="收藏">
              <svg class="icon" viewBox="0 0 24 24" fill="${isS ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </button>
            ${isM
              ? `<button class="slash-btn restore-btn" data-master="${escapeHtml(it.p)}" title="恢复到待背列表">恢复</button>`
              : `<button class="slash-btn" data-master="${escapeHtml(it.p)}" title="标熟并斩掉，不再出现">斩</button>`}
          </div>
          <div class="phrase-block">
            <div class="phrase-text">${formatPhraseHtml(it.p)}</div>
          </div>
        </div>

        <div class="zh-meaning">${escapeHtml(it.z)}</div>
        ${polyHtml}
        ${examplesHtml}

        <div class="card-foot">
          <div class="card-foot-meta">
            <span class="desk-only-meta">${it.occs.length} 条真题出处</span>
            <span class="mob-only-meta">
              <span class="freq-badge ${freqClass}">×${it.count}</span>
              ${clozeBadgeHtml}
              <span class="mob-cat-text">${catLabel(it.c)}</span>
            </span>
          </div>
          <button class="ex-toggle-btn" data-expand="${escapeHtml(it.p)}">
            ${isExp ? "收起例句 ▴" : `<span class="hide-sm">真题</span>例句 (${it.occs.length}) ▾`}
          </button>
        </div>
      </article>`;
  }).join("");

  const loadWrap = document.getElementById("loadMoreWrap");
  if (list.length > state.shown) {
    loadWrap.style.display = "flex";
    document.getElementById("btnLoadMore").textContent = `加载更多（已显示 ${slice.length} / ${list.length}）`;
  } else {
    loadWrap.style.display = "none";
  }
}

// ==================== RENDER MODULE 2: CLOZE DIRECT-BLANK ====================
function renderCloze() {
  const scoped = getScopedCloze(state.clozeExam);
  const ct1 = scoped.filter(q => q.qtype === "整组短语挖空").length;
  const ct2 = scoped.filter(q => q.qtype.startsWith("挖动词")).length;
  const ct3 = scoped.filter(q => q.qtype === "挖介词配原文动词").length;

  const filtered = scoped.filter(q => {
    if (state.clozeType === "all") return true;
    if (state.clozeType === "verb") return q.qtype.startsWith("挖动词");
    return q.qtype === state.clozeType;
  });

  // Compute quiz stats
  let answered = 0, correct = 0;
  for (const q of scoped) {
    const k = `${q.exam}-${q.year}-${q.qnum}`;
    if (state.clozePicks[k]) {
      answered++;
      if (state.clozePicks[k] === q.answer) correct++;
    }
  }
  const acc = answered ? Math.round((correct / answered) * 100) : 0;
  const scopeTxt = state.scope === "10y" ? "英一 16–25 · 英二 15–24" : "英一 10–25 · 英二 10–24";

  document.getElementById("statsStrip").innerHTML = `
    <div class="stat-card">
      <div class="stat-label"><span>完形直接挖空真题</span><span>${scopeTxt}</span></div>
      <div class="stat-value">${scoped.length}</div>
      <div class="stat-sub">整组挖空 ${ct1} · 挖动词 ${ct2} · 挖介词 ${ct3}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span>已作答题数</span><span>点击 A/B/C/D 直接刷题</span></div>
      <div class="stat-value">${answered} / ${scoped.length}</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${scoped.length ? Math.round(answered / scoped.length * 100) : 0}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span>正确率</span><span>官方真题答案校验</span></div>
      <div class="stat-value">${answered ? acc + "%" : "—"}</div>
      <div class="stat-sub">答对 ${correct} 题 · 答错 ${answered - correct} 题</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span>涉及真题选项词组</span><span>含全部干扰项</span></div>
      <div class="stat-value">${scoped.length * 4}</div>
      <div class="stat-sub">每题含 1 正解 + 3 同考点高频干扰项</div>
    </div>`;

  document.getElementById("cntCTAll").textContent = scoped.length;
  document.getElementById("cntCT1").textContent = ct1;
  document.getElementById("cntCT2").textContent = ct2;
  document.getElementById("cntCT3").textContent = ct3;
  document.getElementById("btnClozeRevealAll").classList.toggle("active", state.clozeRevealAll);
  document.getElementById("btnClozeRevealAll").textContent = state.clozeRevealAll ? "隐藏答案（刷题模式）" : "一键显示全部答案";

  document.getElementById("clozeResultsInfo").textContent = `共 ${filtered.length} 道完形填空动介词组挖空真题`;
  document.getElementById("clozeScoreInfo").textContent = answered ? `当前正确率 ${correct}/${answered} (${acc}%)` : "";

  const listEl = document.getElementById("clozeList");
  if (!filtered.length) {
    listEl.innerHTML = `<div class="empty-state">当前筛选下暂无完形挖空题。</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(q => {
    const k = `${q.exam}-${q.year}-${q.qnum}`;
    const pick = state.clozePicks[k];
    const revealed = state.clozeRevealAll || Boolean(pick);
    const examLabel = q.exam === 1 ? "英语（一）" : "英语（二）";
    const srcCls = q.exam === 1 ? "src-1" : "src-2";

    const blankHtml = revealed
      ? `<span class="blank-pill filled">${escapeHtml(q.answerText)}</span>`
      : `<span class="blank-pill">___ ${q.qnum} ___</span>`;
    const sentHtml = escapeHtml(q.sentence).replace("[[BLANK]]", blankHtml);

    const optsHtml = ["A", "B", "C", "D"].map(optLet => {
      const txt = q.options[optLet] || "";
      const gloss = q.optGloss[optLet] || "";
      let cls = "";
      if (revealed) {
        if (optLet === q.answer) cls = "is-correct";
        else if (pick === optLet && optLet !== q.answer) cls = "is-wrong";
      }
      return `
        <button class="cloze-opt-btn ${cls}" data-ckey="${k}" data-clet="${optLet}">
          <div class="opt-main">
            <span class="opt-let">${optLet}.</span>
            <span>${escapeHtml(txt)}</span>
            ${revealed && optLet === q.answer ? `<span style="margin-left:auto;font-size:12px;">✓</span>` : ""}
          </div>
          ${revealed && gloss ? `<div class="opt-gloss">${escapeHtml(gloss)}</div>` : ""}
        </button>`;
    }).join("");

    const explainHtml = revealed ? `
      <div class="cloze-explain">
        <div>
          <strong style="color:var(--sage);">考点词组：${escapeHtml(q.phrase)}</strong>
          <span style="margin-left:8px;color:var(--ink);">${escapeHtml(q.zh)}</span>
          ${q.pairedWord ? `<span class="pill pill-amber" style="margin-left:8px;">原文搭配词：${escapeHtml(q.pairedWord)}</span>` : ""}
        </div>
        ${q.poly ? `<div class="poly-callout">
          <div class="poly-row-fam"><span class="poly-tag-lbl">熟义</span>${escapeHtml(q.poly[0])}</div>
          <div class="poly-row-exm"><span class="poly-tag-lbl">考研生义</span>${escapeHtml(q.poly[1])}</div>
        </div>` : ""}
      </div>` : "";

    return `
      <article class="cloze-card">
        <div class="cloze-head">
          <div class="cloze-head-left">
            <span class="cloze-q-id ${srcCls}">${examLabel} ${q.year} · 第 ${q.qnum} 题</span>
            <span class="pill pill-cloze">${escapeHtml(q.qtype)}</span>
            ${revealed ? `<span class="pill pill-sage">官方正解 ${q.answer}</span>` : ""}
          </div>
          ${revealed ? `<button class="speak-btn" data-speak="${escapeHtml(q.phrase)}" title="朗读考点词组"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg></button>` : ""}
        </div>
        <div class="cloze-sent">${sentHtml}</div>
        <div class="cloze-opts">${optsHtml}</div>
        ${explainHtml}
      </article>`;
  }).join("");
}

// ==================== RENDER MODULE 3: 熟词生义 ====================
function renderPoly() {
  const scoped = getScopedPoly(state.polyExam);
  const q = state.polySearch.trim().toLowerCase();

  const filtered = scoped.filter(it => {
    if (state.polyHardOnly && it.hard === 0) return false;
    if (state.polyStatus === "mastered" && !state.polyMastered.has(it.w)) return false;
    if (state.polyStatus === "unmastered" && state.polyMastered.has(it.w)) return false;
    if (state.polyStatus === "starred" && !state.polyStarred.has(it.w)) return false;
    if (q) {
      const hit = it.w.includes(q) || it.fam.toLowerCase().includes(q) || it.exm.toLowerCase().includes(q);
      if (!hit) return false;
    }
    return true;
  });

  if (state.polySort === "hard") filtered.sort((a, b) => (b.hard - a.hard) || (b.maxY - a.maxY) || a.w.localeCompare(b.w));
  else if (state.polySort === "alpha") filtered.sort((a, b) => a.w.localeCompare(b.w));
  else if (state.polySort === "recent") filtered.sort((a, b) => b.maxY - a.maxY || a.w.localeCompare(b.w));

  currentFilteredPoly = filtered;

  let mCnt = 0, sCnt = 0, e1Words = 0, e2Words = 0, occTotal = 0;
  for (const it of scoped) {
    if (state.polyMastered.has(it.w)) mCnt++;
    if (state.polyStarred.has(it.w)) sCnt++;
    if (it.occs.some(o => o[0] === 1)) e1Words++;
    if (it.occs.some(o => o[0] === 2)) e2Words++;
    occTotal += it.occs.length;
  }
  const pct = scoped.length ? Math.round((mCnt / scoped.length) * 100) : 0;
  const scopeTxt = state.scope === "10y" ? "英一 16–25 · 英二 15–24" : "英一 10–25 · 英二 10–24";

  document.getElementById("mobileSummary").innerHTML = `
    <div class="mobile-summary-top">
      <div class="ms-left">已斩 <strong class="ms-num">${mCnt}</strong> / ${scoped.length} <span class="ms-pct">${pct}%</span></div>
      <div class="ms-right">收藏 ${sCnt} · 真题句 ${occTotal}</div>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>`;

  document.getElementById("statsStrip").innerHTML = `
    <div class="stat-card">
      <div class="stat-label"><span>收录熟词生义</span><span>${scopeTxt}</span></div>
      <div class="stat-value">${scoped.length}</div>
      <div class="stat-sub">剔除六类繁琐标签，聚焦真题生义</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span>真题语境句</span><span>英一 ${e1Words} 词 · 英二 ${e2Words} 词</span></div>
      <div class="stat-value">${occTotal}</div>
      <div class="stat-sub">左半熟生义对比 · 右半直出真题原句</div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span>已斩进度</span><span>${pct}%</span></div>
      <div class="stat-value">${mCnt}</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label"><span>重点收藏</span><span>支持背词遮挡生义</span></div>
      <div class="stat-value">${sCnt}</div>
      <div class="stat-sub">开启「背词遮挡」可只留熟义测生义</div>
    </div>`;

  document.getElementById("cntSlashedPoly").textContent = mCnt > 0 ? mCnt : "";
  document.getElementById("polyResultsCount").textContent =
    `共 ${filtered.length} 个单词熟词生义`;

  document.getElementById("btnPolyHardOnly").classList.toggle("active-plum", state.polyHardOnly);
  const pAdv = (!state.polyHardOnly ? 1 : 0) + (state.polyExam !== "all" ? 1 : 0) + (state.polySort !== "hard" ? 1 : 0);
  document.getElementById("btnPolyFilterDrawer").classList.toggle("has-active", pAdv > 0);
  document.getElementById("polyFilterActiveCount").textContent = pAdv > 0 ? `(${pAdv}) ` : "";
  document.getElementById("btnPolyShowExAll").textContent = state.polyShowExamples ? "收起例句 ▴" : "显示例句 ▾";

  const grid = document.getElementById("polyGrid");
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state">当前列表已全部斩完或无匹配词条。</div>`;
    return;
  }

  grid.innerHTML = filtered.map(it => {
    const isM = state.polyMastered.has(it.w);
    const isS = state.polyStarred.has(it.w);
    const isExp = state.polyExpanded.has(it.w);
    const shownOccs = isExp ? it.occs.slice(0, 8) : (state.polyShowExamples ? it.occs.slice(0, 1) : []);

    const examplesHtml = shownOccs.length ? `
      <div class="examples-drawer">
        ${shownOccs.map(o => `
          <div class="example-box">
            <span class="example-src src-${o[0]}">${o[0] === 1 ? "英一" : "英二"} ${o[1]} · ${escapeHtml(o[2])}</span>
            ${highlightSentence(o[4], o[3])}
          </div>`).join("")}
      </div>` : "";

    const polyTone = it.hard ? "poly" : "low";
    const examTag = [
      it.occs.some(o => o[0] === 1) ? "英一" : "",
      it.occs.some(o => o[0] === 2) ? "英二" : "",
    ].filter(Boolean).join(" / ") || "考研真题";

    return `
      <article class="word-card ${isM ? "mastered" : ""}" data-tone="${polyTone}" data-key="${escapeHtml(it.w)}">
        <div class="card-header-grid">
          <div class="card-eyebrow-meta">
            <span>${examTag}</span>
          </div>
          <div class="card-right">
            <button class="icon-btn ${isS ? "starred" : ""}" data-pstar="${escapeHtml(it.w)}" title="收藏">
              <svg class="icon" viewBox="0 0 24 24" fill="${isS ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </button>
            ${isM
              ? `<button class="slash-btn restore-btn" data-pmaster="${escapeHtml(it.w)}" title="恢复到待背列表">恢复</button>`
              : `<button class="slash-btn" data-pmaster="${escapeHtml(it.w)}" title="标熟并斩掉，不再出现">斩</button>`}
          </div>
          <div class="phrase-block">
            <div class="phrase-text">${escapeHtml(it.w)} <span class="word-pos-pill">${escapeHtml(it.pos)}</span></div>
          </div>
        </div>
        <div class="poly-callout">
          <div class="poly-row-fam"><span class="poly-tag-lbl">熟义</span><span>${escapeHtml(it.fam)}</span></div>
          <div class="poly-row-exm"><span class="poly-tag-lbl">生义</span><span>${escapeHtml(it.exm)}</span></div>
        </div>
        ${examplesHtml}
        <div class="card-foot">
          <div class="card-foot-meta">
            <span class="desk-only-meta">${it.occs.length ? `${it.occs.length} 条真题语境` : "考研核心生义"}</span>
            <span class="mob-only-meta"><span class="mob-cat-text">${examTag}</span></span>
          </div>
          <button class="ex-toggle-btn" data-pexpand="${escapeHtml(it.w)}">
            ${isExp ? "收起例句 ▴" : `<span class="hide-sm">真题</span>例句 (${it.occs.length}) ▾`}
          </button>
        </div>
      </article>`;
  }).join("");
}

// ==================== Analytics (GA4 v2) ====================
function trackEvent(name, params = {}, useBeacon = false) {
  const gaState = window.__GA_STATE__ || { enabled: false, debug: false };
  if (!gaState.enabled) {
    console.debug("[GA4 disabled]", name, params);
    return;
  }
  if (typeof window.gtag !== "function") return;
  const payload = {};
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined) payload[k] = v;
  }
  if (gaState.debug) payload.debug_mode = true;
  if (useBeacon) payload.transport_type = "beacon";
  if (gaState.debug) console.debug("[GA4 debug]", name, payload);
  window.gtag("event", name, payload);
}

function setUserProperties(props) {
  const gaState = window.__GA_STATE__;
  if (!gaState || !gaState.enabled || typeof window.gtag !== "function") return;
  window.gtag("set", "user_properties", props);
}

function tierBucket(count, isPoly = false) {
  if (count <= 0) return "0";
  if (count <= 10) return "1-10";
  if (count <= 50) return "11-50";
  if (isPoly) return "50+";
  return count <= 150 ? "51-150" : "150+";
}

function getItemFreqTier(mode, key) {
  if (mode === "poly") {
    const it = BUNDLE.polysemy.find(x => x.w === key);
    return it && it.hard ? "hard" : "normal";
  }
  const it = currentFilteredPhrases.find(x => x.p === key) || BUNDLE.phrases.find(x => x.p === key);
  const count = it ? (it.count ?? it.o.length) : 0;
  return count >= 8 ? "high" : (count >= 3 ? "mid" : "low");
}

const analyticsSession = {
  sessionMasteredCount: 0,
  milestonesFired: new Set(),
  blurRevealedCount: 0,
};

function recordMasterMilestone() {
  analyticsSession.sessionMasteredCount++;
  const n = analyticsSession.sessionMasteredCount;
  const milestone = n === 1 ? "first_master" : (n === 5 ? "session_5_mastered" : (n === 20 ? "session_20_mastered" : null));
  if (milestone && !analyticsSession.milestonesFired.has(milestone)) {
    analyticsSession.milestonesFired.add(milestone);
    trackEvent("study_milestone", { milestone });
  }
}

let searchTrackTimer = null;
function trackSearchDebounced(mode, query) {
  clearTimeout(searchTrackTimer);
  const q = query.trim();
  if (!q) return;
  searchTrackTimer = setTimeout(() => {
    const resultCount = mode === "poly" ? currentFilteredPoly.length : currentFilteredPhrases.length;
    trackEvent("search", {
      search_term: q.slice(0, 60),
      mode,
      result_count: resultCount,
      is_zero_result: resultCount === 0,
    });
  }, 800);
}

function trackFilter(mode, filterType, filterValue) {
  const resultCount = mode === "poly" ? currentFilteredPoly.length : currentFilteredPhrases.length;
  trackEvent("apply_filter", {
    mode,
    filter_type: filterType,
    filter_value: String(filterValue),
    result_count: resultCount,
  });
}

function flushBlurSession(useBeacon = false) {
  if (state.blur && analyticsSession.blurRevealedCount > 0) {
    trackEvent("toggle_blur_mode", {
      enabled: false,
      revealed_count: analyticsSession.blurRevealedCount,
    }, useBeacon);
    analyticsSession.blurRevealedCount = 0;
  }
}

function initAnalyticsSession() {
  const returning = state.mastered.size > 0 || state.starred.size > 0 || state.polyMastered.size > 0 || state.polyStarred.size > 0;
  const viewportType = window.innerWidth <= 768 ? "mobile" : "desktop";
  const preferredTheme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  setUserProperties({
    returning_learner: String(returning),
    mastered_phrases_tier: tierBucket(state.mastered.size, false),
    mastered_poly_tier: tierBucket(state.polyMastered.size, true),
    viewport_type: viewportType,
    preferred_theme: preferredTheme,
  });
  trackEvent("learner_session_init", {
    entry_module: state.mod,
    has_progress: returning,
    phrases_mastered_cnt: state.mastered.size,
    poly_mastered_cnt: state.polyMastered.size,
    viewport_type: viewportType,
  });
}

// ==================== FLIP + Ink-Slash Engine & Undo Toast ====================
const prefersReducedMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let toastTimer = null;
let lastUndoAction = null;
let lastUndoMeta = null;

function showToast(text, onUndo, meta = null) {
  const host = document.getElementById("toastHost");
  document.getElementById("toastText").textContent = text;
  lastUndoAction = onUndo;
  lastUndoMeta = meta;
  host.classList.add("visible");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    host.classList.remove("visible");
  }, 4200);
}

document.getElementById("toastUndo").addEventListener("click", () => {
  if (lastUndoAction) {
    const fn = lastUndoAction;
    const meta = lastUndoMeta;
    lastUndoAction = null;
    lastUndoMeta = null;
    clearTimeout(toastTimer);
    document.getElementById("toastHost").classList.remove("visible");
    trackEvent("undo_action", meta || {});
    fn();
  }
});

function flipGridTransition(gridEl, mutateAndRender, enterKey = null) {
  if (prefersReducedMotion()) {
    mutateAndRender();
    return;
  }
  // FIRST: measure all visible cards
  const firstRects = new Map();
  gridEl.querySelectorAll(".word-card[data-key]").forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.bottom > -200 && r.top < window.innerHeight + 300) {
      firstRects.set(el.dataset.key, { left: r.left, top: r.top });
    }
  });

  // LAST: mutate state and re-render DOM
  mutateAndRender();

  // INVERT & PLAY
  const animTargets = [];
  gridEl.querySelectorAll(".word-card[data-key]").forEach(el => {
    const key = el.dataset.key;
    if (enterKey && key === enterKey) {
      el.classList.add("is-entering");
      el.addEventListener("animationend", () => el.classList.remove("is-entering"), { once: true });
      return;
    }
    const prev = firstRects.get(key);
    if (!prev) return;
    const next = el.getBoundingClientRect();
    const dx = prev.left - next.left;
    const dy = prev.top - next.top;
    if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
      el.style.transition = "none";
      el.style.transform = `translate3d(${dx}px, ${dy}px, 0)`;
      animTargets.push(el);
    }
  });

  if (animTargets.length) {
    // Force single layout flush
    void gridEl.offsetHeight;
    requestAnimationFrame(() => {
      for (const el of animTargets) {
        el.style.transition = "transform 420ms cubic-bezier(0.16, 1, 0.3, 1)";
        el.style.transform = "translate3d(0, 0, 0)";
        el.addEventListener("transitionend", () => {
          el.style.transition = "";
          el.style.transform = "";
        }, { once: true });
      }
    });
  }
}

function handleSlashToggle(gridEl, cardEl, key, targetSet, renderFn, currentStatus, mode = "phrases") {
  const isAlreadySlashed = targetSet.has(key);
  if (isAlreadySlashed) {
    // Restore smoothly with FLIP
    flipGridTransition(gridEl, () => {
      targetSet.delete(key);
      saveProgress();
      renderFn();
    });
    showToast(`已恢复「${key}」`, () => {
      flipGridTransition(gridEl, () => {
        targetSet.add(key);
        saveProgress();
        renderFn();
      }, key);
    }, { mode, source: "card", action: "restore" });
    return;
  }

  // Slashing a word! If currently viewing "待背" (or not "all"), play the silky ink-slash -> vanish -> FLIP reflow!
  const willDisappear = (currentStatus !== "all");
  if (!willDisappear || prefersReducedMotion() || !cardEl) {
    targetSet.add(key);
    saveProgress();
    renderFn();
    showToast(`已斩「${key}」`, () => {
      targetSet.delete(key);
      saveProgress();
      renderFn();
    }, { mode, source: "card", action: "master" });
    return;
  }

  if (cardEl.classList.contains("is-slashing") || cardEl.classList.contains("is-vanishing")) return;

  // Phase 1: Crisp Ink Slash Strike
  const overlay = document.createElement("div");
  overlay.className = "slash-overlay";
  overlay.innerHTML = `<div class="slash-line"></div><div class="slash-stamp">已斩</div>`;
  cardEl.appendChild(overlay);
  cardEl.classList.add("is-slashing");

  // Phase 2: Smooth Lift & Vanish
  setTimeout(() => {
    cardEl.classList.add("is-vanishing");
  }, 170);

  // Phase 3: Remove & FLIP Reflow all sibling cards smoothly
  setTimeout(() => {
    flipGridTransition(gridEl, () => {
      targetSet.add(key);
      saveProgress();
      renderFn();
    });
    showToast(`已斩「${key}」`, () => {
      flipGridTransition(gridEl, () => {
        targetSet.delete(key);
        saveProgress();
        renderFn();
      }, key);
    }, { mode, source: "card", action: "master" });
  }, 360);
}
